on: [push, workflow_dispatch]
permissions: { id-token: write, contents: read }
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          T=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=r1aud" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          curl -s -w '\nHTTP %{http_code}\n' -X POST -H 'Content-Type: application/json' \
            -d "{\"grant_type\":\"urn:ietf:params:oauth:grant-type:token-exchange\",\"subject_token_type\":\"urn:ietf:params:oauth:token-type:id_token\",\"subject_token\":\"$T\",\"provider_name\":\"r1ghpin\"}" \
            https://trialuakwcj.jfrog.io/access/api/v1/oidc/token | head -c 120
