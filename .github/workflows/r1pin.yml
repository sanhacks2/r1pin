name: r1pin
on:
  push:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for PAIR in r1aud:r1ghpin r2aud:r2audgh; do
            A=${PAIR%%:*}; P=${PAIR##*:}
            T=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$A" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
            echo "### aud=$A provider=$P claims:"
            echo "$T" | python3 -c 'import sys,json,base64;p=sys.stdin.read().split(".")[1];p+="="*(-len(p)%4);d=json.loads(base64.urlsafe_b64decode(p));print({k:d.get(k) for k in ("aud","repository","repository_owner","repository_owner_id","repository_id","actor","actor_id","ref")})'
            curl -s -o /tmp/o -w 'HTTP %{http_code}\n' -X POST -H 'Content-Type: application/json' -d "{\"grant_type\":\"urn:ietf:params:oauth:grant-type:token-exchange\",\"subject_token_type\":\"urn:ietf:params:oauth:token-type:id_token\",\"subject_token\":\"$T\",\"provider_name\":\"$P\"}" https://trialuakwcj.jfrog.io/access/api/v1/oidc/token
            python3 -c 'import json,base64
            b=open("/tmp/o").read()
            try:
              d=json.loads(b); t=d.get("access_token")
              if t:
                p=t.split(".")[1]; p+="="*(-len(p)%4); c=json.loads(base64.urlsafe_b64decode(p)); print("JFROG sub=",c.get("sub"),"scp=",c.get("scp"),"iat=",c.get("iat"))
              else: print("BODY", b[:300])
            except Exception as e: print("BODY", b[:300])'
          done
